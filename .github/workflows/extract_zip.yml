
name: Extract Godot Project ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'WartegSimulatorIndonesia_Foundation.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          test -f WartegSimulatorIndonesia_Foundation.zip
          unzip -q WartegSimulatorIndonesia_Foundation.zip
          cp -a WartegSimulatorIndonesia_Foundation/. .
          rm -rf WartegSimulatorIndonesia_Foundation
          rm -f WartegSimulatorIndonesia_Foundation.zip
          printf ".godot/\n" > .gitignore

      - name: Validate Godot project
        run: |
          test -f project.godot
          godot --headless --editor --path . --quit

      - name: Save extracted files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract Godot foundation project"
            git push
          fi
          
